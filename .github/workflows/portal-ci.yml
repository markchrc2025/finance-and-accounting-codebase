name: Portal CI

# Gates the React portal (sentire-books/). Separate from the API workflow
# (ci.yml) on purpose: the API job needs Postgres + pnpm and is path-filtered to
# sentire-books-api/**; touching either workflow must never weaken the other.
on:
  push:
    paths:
      - "sentire-books/**"
      - ".github/workflows/portal-ci.yml"
  pull_request:
    paths:
      - "sentire-books/**"
      - ".github/workflows/portal-ci.yml"

defaults:
  run:
    working-directory: sentire-books

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentire-books/package-lock.json

      - name: Install
        run: npm ci

      # Ratchet lint: new errors fail; the checked-in suppressions baseline
      # absorbs pre-existing violations. See eslint.config.js.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
